name: Release Please

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.releases_created == 'true' &&
        (
          contains(needs.release-please.outputs.paths_released, 'packages/ts/core') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ts/sending') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ts/mailbox') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ts/management') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ts/sdk')
        )
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out OpenAPI snapshots
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Sendmux/docs
          path: sendmux-docs

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: go/go.sum

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and verify
        run: pnpm build

      - name: Publish TypeScript packages to npm
        run: pnpm publish:npm:ts

  publish-pypi:
    needs: release-please
    if: >-
      ${{
        (
          needs.release-please.outputs.releases_created == 'true' &&
          (
            contains(needs.release-please.outputs.paths_released, 'packages/python/core') ||
            contains(needs.release-please.outputs.paths_released, 'packages/python/sending') ||
            contains(needs.release-please.outputs.paths_released, 'packages/python/mailbox') ||
            contains(needs.release-please.outputs.paths_released, 'packages/python/management') ||
            contains(needs.release-please.outputs.paths_released, 'packages/python/sdk')
          )
        )
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out OpenAPI snapshots
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Sendmux/docs
          path: sendmux-docs

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6
        with:
          python-version: "3.12"

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.23.x"
          cache-dependency-path: go/go.sum

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Python distributions
        run: pnpm build:python:dists

      - name: Select unpublished Python distributions
        id: python-publish
        run: pnpm prepare:publish:pypi

      - name: Publish Python packages to PyPI
        if: ${{ steps.python-publish.outputs.has_files == 'true' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: .tmp/python-publish

  publish-rubygems:
    needs: release-please
    if: >-
      ${{
        needs.release-please.outputs.releases_created == 'true' &&
        (
          contains(needs.release-please.outputs.paths_released, 'packages/ruby/core') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ruby/sending') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ruby/mailbox') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ruby/management') ||
          contains(needs.release-please.outputs.paths_released, 'packages/ruby/sdk')
        )
      }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out SDK
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check out OpenAPI snapshots
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Sendmux/docs
          path: sendmux-docs

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: "3.4.1"
          bundler-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Ruby gems
        run: pnpm build:ruby

      - name: Configure RubyGems trusted publishing credentials
        uses: rubygems/configure-rubygems-credentials@762a4b77c3300434bb57c7ce80b20e36231927aa # v2.0.0

      - name: Publish Ruby packages to RubyGems
        run: pnpm publish:rubygems
        env:
          RUBY_PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
