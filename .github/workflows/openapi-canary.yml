name: OpenAPI Live Canary

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live-vs-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SDK
        uses: actions/checkout@v4

      - name: Check out OpenAPI snapshots
        uses: actions/checkout@v4
        with:
          repository: Sendmux/docs
          path: sendmux-docs

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare live specs to snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: pnpm canary:openapi --docs-dir sendmux-docs --issue
