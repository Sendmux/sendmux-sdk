[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
  "packages/python/.*/sendmux_.*/api/.*",
  "packages/python/.*/sendmux_.*/models/.*",
  "packages/python/.*/sendmux_.*/api_client.py",
  "packages/python/.*/sendmux_.*/api_response.py",
  "packages/python/.*/sendmux_.*/configuration.py",
  "packages/python/.*/sendmux_.*/exceptions.py",
  "packages/python/.*/sendmux_.*/rest.py",
]

[[tool.mypy.overrides]]
module = [
  "sendmux_sending.*",
  "sendmux_mailbox.*",
  "sendmux_management.*",
  "fastmcp.*",
  "posthog.*",
  "starlette.*",
]
ignore_missing_imports = true
