[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
exclude = [
  "packages/python/.*/sendmux_.*/api/.*",
  "packages/python/.*/sendmux_.*/models/.*",
  "packages/python/.*/sendmux_.*/api_client.py",
  "packages/python/.*/sendmux_.*/api_response.py",
  "packages/python/.*/sendmux_.*/configuration.py",
  "packages/python/.*/sendmux_.*/exceptions.py",
  "packages/python/.*/sendmux_.*/rest.py",
]

[[tool.mypy.overrides]]
module = [
  "sendmux_sending.*",
  "sendmux_mailbox.*",
  "sendmux_management.*",
  "fastmcp.*",
  "posthog.*",
  "starlette.*",
]
ignore_missing_imports = true

# langchain-sendmux installs langchain-core (and its transitive langsmith) into
# the check-python venv so the toolkit tests can import it. Do not follow mypy
# into those third-party trees: mypy crashes on langsmith's generated openapi
# client, and the toolkit is fully checked against the generated sendmux models
# regardless. Treat them as Any.
[[tool.mypy.overrides]]
module = [
  "langchain_core.*",
  "langchain.*",
  "langsmith.*",
]
follow_imports = "skip"
ignore_missing_imports = true
