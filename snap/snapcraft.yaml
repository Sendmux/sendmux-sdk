name: sendmux
title: Sendmux CLI
base: core26
version: "1.7.2"
summary: Official command-line interface for Sendmux email APIs
description: |
  Manage Sendmux from Linux terminals and automation with the official Sendmux CLI.

  Use sendmux to configure local profiles, inspect available Management, Mailbox,
  and Sending API commands, and run Sendmux workflows with JSON output for scripts.

  The snap packages the published @sendmux/cli npm release with a bundled Node.js
  runtime. Authenticate API operations with OAuth or your own Sendmux API key;
  no credentials are included.

license: MIT
contact: https://github.com/Sendmux/sendmux-sdk/issues
issues: https://github.com/Sendmux/sendmux-sdk/issues
source-code: https://github.com/Sendmux/sendmux-sdk
website: https://sendmux.ai/docs

grade: stable
confinement: strict

platforms:
  amd64:
  arm64:

apps:
  sendmux:
    command: bin/sendmux
    plugs:
      - home
      - network
      - network-bind
    environment:
      SENDMUX_CONFIG_DIR: $SNAP_USER_COMMON/.config/sendmux
      SENDMUX_DATA_DIR: $SNAP_USER_COMMON/.local/share/sendmux
      SENDMUX_CACHE_DIR: $SNAP_USER_COMMON/.cache/sendmux

parts:
  sendmux:
    plugin: npm
    source: https://registry.npmjs.org/@sendmux/cli/-/cli-1.7.2.tgz
    source-type: tar
    source-checksum: sha512/fc88abd7041f7812a09892c0c301723da4d614cdd1b737416411b041ab8558881baabb6a72fb7c6f944ab270900a164257e1c9a1fc098b373dc8eb0f83807f6c
    npm-include-node: true
    npm-node-version: "22.22.3"

lint:
  ignore:
    - metadata:
        - donation
