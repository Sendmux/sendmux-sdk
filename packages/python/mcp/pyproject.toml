[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sendmux-mcp"
version = "1.6.2"
description = "Email inbox API and outbound sending tools for AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "a2a-sdk[http-server]==1.1.2",
  "fastmcp==3.3.1",
  "httpx>=0.28.1,<1",
  "posthog>=7.21.0,<8",
  "sendmux-core>=1.2.0,<2.0.0",
]

[project.scripts]
sendmux-mcp = "sendmux_mcp.cli:main"
sendmux-mcp-hosted = "sendmux_mcp.hosted:run_hosted"
sendmux-mcp-mailbox = "sendmux_mcp.cli:main_mailbox"
sendmux-mcp-management = "sendmux_mcp.cli:main_management"
sendmux-mcp-sending = "sendmux_mcp.cli:main_sending"

[project.urls]
Repository = "https://github.com/Sendmux/sendmux-sdk"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "LICENSE",
  "README.md",
  "evals.xml",
  "sendmux_mcp",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["sendmux_mcp"]
artifacts = ["sendmux_mcp/openapi/*.json"]
